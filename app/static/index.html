<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnchorzUp Meeting Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" type="image/png" href="/brand/icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main class="login" id="login" hidden>
  <div class="login-card">
    <img src="/brand/logo.svg" alt="AnchorzUp" class="login-logo">
    <span class="eyebrow accent">Meeting Agent</span>
    <h1 id="login-title">Hyr me emailin e punës</h1>
    <p class="muted" id="login-sub">Do të marrësh një kod 6-shifror në email.</p>
    <form id="login-email-form" class="login-form">
      <label class="field">Emaili i punës
        <input type="email" id="login-email" autocomplete="email" required placeholder="emri@anchorzup.com">
      </label>
      <button type="submit" class="btn btn-primary btn-block">Dërgo kodin</button>
    </form>
    <form id="login-code-form" class="login-form" hidden>
      <label class="field">Kodi nga emaili
        <input type="text" id="login-code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" required placeholder="000000" class="code-input">
      </label>
      <button type="submit" class="btn btn-primary btn-block">Hyr</button>
      <button type="button" class="btn btn-block" id="login-back">Përdor email tjetër</button>
    </form>
    <p class="form-error" id="login-error" role="alert"></p>
  </div>
</main>
<div class="shell" id="shell" hidden>
  <aside class="sidebar">
    <a class="brand" href="#/" aria-label="AnchorzUp Meeting Agent, paneli">
      <img src="/brand/logo-white.svg" alt="AnchorzUp" class="brand-logo">
      <span class="brand-product">Meeting Agent</span>
    </a>
    <button type="button" class="btn btn-light btn-block" data-action="upload" data-role="manager"><span data-icon="plus"></span>Mbledhje e re</button>
    <nav class="nav" aria-label="Navigimi kryesor">
      <a href="#/" data-route="home"><span data-icon="grid"></span>Paneli</a>
      <a href="#/meetings" data-route="meetings"><span data-icon="mic"></span>Mbledhjet</a>
      <a href="#/tasks" data-route="tasks"><span data-icon="check"></span>Detyrat<span class="nav-count" id="open-count"></span></a>
      <a href="#/ask" data-route="ask"><span data-icon="chat"></span>Pyet arkivin</a>
      <a href="#/team" data-route="team" data-role="admin"><span data-icon="users"></span>Ekipi</a>
      <a href="#/outbox" data-route="outbox" data-role="admin"><span data-icon="mail"></span>Njoftimet</a>
    </nav>
    <div class="integrations" data-role="admin">
      <span class="eyebrow">Lidhjet</span>
      <div class="integration"><span class="dot" id="st-claude"></span>Claude API<small id="st-claude-t"></small></div>
      <div class="integration"><span class="dot" id="st-speakers"></span>Folësit<small id="st-speakers-t"></small></div>
      <div class="integration"><span class="dot" id="st-email"></span>Email (Gmail)<small id="st-email-t"></small></div>
      <div class="integration"><span class="dot" id="st-jira"></span>Jira<small id="st-jira-t"></small></div>
    </div>
    <div class="me" id="me">
      <span class="avatar" id="me-avatar"></span>
      <span class="me-text"><strong id="me-name"></strong><small id="me-role"></small></span>
      <button type="button" class="icon-btn" id="logout" aria-label="Dil" title="Dil"><span data-icon="logout"></span></button>
    </div>
  </aside>
  <main class="content" id="view" tabindex="-1"></main>
</div>

<dialog id="upload-dialog" class="dialog">
  <form method="dialog" id="upload-form" class="dialog-body">
    <div class="dialog-head">
      <h2>Mbledhje e re</h2>
      <button type="button" class="icon-btn" data-close aria-label="Mbyll"><span data-icon="x"></span></button>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" class="tab active" data-mode="file" aria-selected="true">Ngarko skedar</button>
      <button type="button" role="tab" class="tab" data-mode="record" aria-selected="false">Regjistro tani</button>
    </div>

    <div data-pane="file">
      <label class="drop" id="drop">
        <input type="file" id="file-input" accept=".mp3,.wav,.m4a,.webm,.ogg,.mp4,.flac,.aac,.json">
        <span data-icon="upload"></span>
        <strong id="drop-title">Zgjidh ose tërhiq regjistrimin këtu</strong>
        <small id="drop-sub">mp3, wav, m4a, webm… ose një transkript .json</small>
      </label>
    </div>

    <div data-pane="record" hidden>
      <div class="recorder">
        <button type="button" class="rec-btn" id="rec-btn" aria-label="Fillo regjistrimin"><span></span></button>
        <div class="rec-info">
          <strong id="rec-time">00:00</strong>
          <small id="rec-state">Shtyp butonin për të filluar regjistrimin nga mikrofoni</small>
        </div>
      </div>
    </div>

    <div class="field-grid">
      <label class="field field-wide">Titulli
        <input type="text" id="f-title" placeholder="p.sh. Sinkronizimi javor" maxlength="200">
      </label>
      <label class="field">Data e mbledhjes
        <input type="date" id="f-date" required>
      </label>
      <label class="field">Ekipi
        <select id="f-team"></select>
      </label>
      <label class="field">Projekti
        <select id="f-project"></select>
      </label>
      <label class="field">Gjuha
        <select id="f-lang">
          <option value="">Automatike</option>
          <option value="sq">Shqip</option>
          <option value="en">English</option>
        </select>
      </label>
      <label class="field field-wide">Modeli i transkriptimit
        <select id="f-model"></select>
        <small id="f-model-hint"></small>
      </label>
    </div>
    <p class="form-error" id="upload-error" role="alert"></p>
    <div class="dialog-actions">
      <button type="button" class="btn" data-close>Anulo</button>
      <button type="submit" class="btn btn-primary" id="upload-submit" disabled>Fillo përpunimin</button>
    </div>
  </form>
</dialog>

<dialog id="form-dialog" class="dialog">
  <form method="dialog" id="form-dialog-form" class="dialog-body"></form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
